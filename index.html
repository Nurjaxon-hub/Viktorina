<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Viktorina</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="questions.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#18202f;
}

body{
  overflow-x:hidden;
}

button{
  border:0;
  font:inherit;
  cursor:pointer;
}

#app{
  width:100%;
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:30px;
}

/* HOME */

.header{
  padding:22px 18px 12px;
}

.logo{
  font-size:30px;
  font-weight:900;
}

.logo span{
  color:#6c5ce7;
}

.subtitle{
  color:#7b8495;
  margin-top:5px;
  font-size:14px;
}

.card{
  background:#fff;
  border-radius:22px;
  margin:10px 14px;
  padding:18px;
  box-shadow:0 5px 20px rgba(30,40,70,.07);
}

.cardTitle{
  font-size:18px;
  font-weight:800;
  margin-bottom:14px;
}

.modeGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mode{
  padding:15px 12px;
  background:#f2f3fa;
  border-radius:16px;
  text-align:left;
  transition:.15s;
}

.mode:active{
  transform:scale(.97);
}

.mode.active{
  background:#6c5ce7;
  color:#fff;
}

.mode b{
  display:block;
  font-size:16px;
  margin-bottom:5px;
}

.mode small{
  opacity:.75;
  line-height:1.3;
}

.categoryGrid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.cat{
  background:#eef0f7;
  border-radius:12px;
  padding:10px 13px;
  font-size:13px;
}

.cat.active{
  background:#6c5ce7;
  color:#fff;
}

.row{
  display:flex;
  gap:10px;
}

.selectBox{
  flex:1;
  background:#f1f3f8;
  border-radius:14px;
  padding:12px;
}

.selectBox label{
  display:block;
  font-size:11px;
  color:#7d8493;
  margin-bottom:5px;
}

.selectBox select{
  width:100%;
  border:0;
  background:transparent;
  outline:0;
  font-size:15px;
  font-weight:700;
}

.startBtn{
  width:calc(100% - 28px);
  margin:10px 14px;
  padding:16px;
  border-radius:18px;
  background:#6c5ce7;
  color:#fff;
  font-weight:800;
  font-size:17px;
  box-shadow:0 8px 20px rgba(108,92,231,.25);
}

.startBtn:active{
  transform:scale(.98);
}

/* GAME */

#game{
  display:none;
}

.gameTop{
  padding:16px 15px 8px;
}

.gameInfo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.progress{
  font-weight:800;
  font-size:14px;
}

.score{
  font-weight:800;
  color:#6c5ce7;
}

.timer{
  margin-top:12px;
  height:10px;
  background:#e4e7ef;
  border-radius:20px;
  overflow:hidden;
}

.timerBar{
  height:100%;
  width:100%;
  background:#6c5ce7;
  transition:width .1s linear;
}

.questionCard{
  background:#fff;
  margin:12px 14px;
  border-radius:22px;
  padding:20px 17px;
  box-shadow:0 5px 20px rgba(30,40,70,.07);
}

.categoryLabel{
  color:#6c5ce7;
  font-size:12px;
  font-weight:800;
  margin-bottom:10px;
}

.question{
  font-size:21px;
  line-height:1.35;
  font-weight:800;
}

.answers{
  margin-top:18px;
  display:grid;
  gap:10px;
}

.answer{
  width:100%;
  text-align:left;
  padding:15px;
  border-radius:16px;
  background:#f1f3f8;
  font-size:15px;
  line-height:1.3;
  transition:.15s;
}

.answer:active{
  transform:scale(.985);
}

.answer.correct{
  background:#24b47e;
  color:#fff;
}

.answer.wrong{
  background:#ef5350;
  color:#fff;
}

.answer.disabled{
  pointer-events:none;
  opacity:.7;
}

.gameActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:10px 14px;
}

.actionBtn{
  padding:13px;
  border-radius:15px;
  background:#fff;
  font-weight:700;
  box-shadow:0 4px 15px rgba(30,40,70,.06);
}

.actionBtn:active{
  transform:scale(.97);
}

.life{
  color:#ef5350;
}

.streak{
  color:#ff9800;
}

/* RESULT */

.result{
  display:none;
  padding:30px 15px;
  text-align:center;
}

.resultIcon{
  font-size:58px;
}

.result h1{
  margin:10px 0;
}

.resultScore{
  font-size:40px;
  font-weight:900;
  color:#6c5ce7;
}

.resultInfo{
  margin-top:12px;
  color:#6d7483;
  line-height:1.7;
}

.resultBtn{
  width:100%;
  margin-top:20px;
  padding:16px;
  border-radius:17px;
  background:#6c5ce7;
  color:#fff;
  font-weight:800;
}

/* PROFILE */

.profile{
  display:none;
  padding:18px 14px;
}

.profileCard{
  background:#fff;
  border-radius:22px;
  padding:20px;
  text-align:center;
}

.avatar{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#6c5ce7;
  color:#fff;
  font-size:32px;
  font-weight:900;
}

.profileName{
  font-size:21px;
  font-weight:900;
  margin-top:10px;
}

.level{
  color:#6c5ce7;
  font-weight:800;
  margin-top:5px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:18px;
}

.stat{
  background:#f1f3f8;
  border-radius:14px;
  padding:12px 5px;
}

.stat b{
  display:block;
  font-size:19px;
}

.stat small{
  color:#777f8e;
}

/* NAV */

.nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:9px 5px calc(9px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 18px rgba(20,30,60,.08);
  z-index:50;
}

.nav button{
  background:none;
  color:#8a91a0;
  font-size:12px;
  padding:5px 20px;
}

.nav button.active{
  color:#6c5ce7;
  font-weight:800;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:100;
  align-items:flex-end;
  justify-content:center;
}

.modalBox{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:22px;
  max-height:85vh;
  overflow:auto;
}

.modalBox h2{
  margin-top:0;
}

.closeBtn{
  width:100%;
  padding:14px;
  border-radius:15px;
  background:#f0f1f6;
  margin-top:15px;
  font-weight:700;
}

/* TASKS */

.task{
  background:#f1f3f8;
  border-radius:15px;
  padding:13px;
  margin-bottom:9px;
}

.task b{
  display:block;
}

.task small{
  color:#727987;
}

/* FEEDBACK */

textarea{
  width:100%;
  min-height:120px;
  resize:none;
  border:1px solid #ddd;
  border-radius:15px;
  padding:13px;
  font:inherit;
  outline:none;
}

/* HIDDEN */

.hidden{
  display:none!important;
}

@media(max-width:360px){
  .modeGrid{
    grid-template-columns:1fr;
  }

  .question{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- HOME -->
  <section id="home">

    <div class="header">

<script>

/* =========================
   TELEGRAM
========================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
  ? window.Telegram.WebApp
  : null;

if(tg){
  tg.ready();
  tg.expand();
}


/* =========================
   SAVOLLAR BAZASINI OLISH
========================= */

function getRawQuestions(){

  /*
    Sizning questions.js faylingiz:
    
    const Q = {
      "Umumiy":[...],
      "Tarix":[...],
      ...
    };

    Shuning uchun asosiy baza Q orqali olinadi.
  */

  try{

    if(typeof Q !== "undefined" &&
       Q &&
       typeof Q === "object"){

      return Q;

    }

  }catch(e){}


  /* Eski formatlarni ham qo‘llab-quvvatlash */

  try{

    if(typeof questions !== "undefined" &&
       Array.isArray(questions)){

      return questions;

    }

  }catch(e){}


  try{

    if(typeof QUESTIONS !== "undefined" &&
       Array.isArray(QUESTIONS)){

      return QUESTIONS;

    }

  }catch(e){}


  if(Array.isArray(window.questions)){
    return window.questions;
  }


  if(Array.isArray(window.QUESTIONS)){
    return window.QUESTIONS;
  }


  return {};

}


/* =========================
   SAVOLLARNI YAGONA FORMATGA KELTIRISH
========================= */

function allPool(){

  const raw = getRawQuestions();

  const pool = [];


  /*
    Q obyekt bo‘lsa:
    {
      "Umumiy":[...],
      "Tarix":[...]
    }
  */

  if(
    raw &&
    typeof raw === "object" &&
    !Array.isArray(raw)
  ){

    Object.keys(raw).forEach(category => {

      const arr =
        Array.isArray(raw[category])
        ? raw[category]
        : [];


      arr.forEach((q,i) => {

        if(Array.isArray(q)){

          pool.push({

            id:
              q.id ||
              ("q" + category + i),

            q:q[0],

            correct:q[1],

            wrong:[
              q[2],
              q[3],
              q[4]
            ],

            category:category

          });

        }

        else if(
          q &&
          typeof q === "object"
        ){

          pool.push({

            id:
              q.id ||
              ("q" + category + i),

            q:
              q.question ||
              q.q ||
              "",

            correct:
              q.correct ||
              q.answer ||
              "",

            wrong:
              q.wrong ||
              q.answers ||
              [],

            category:
              q.category ||
              category

          });

        }

      });

    });

    return pool.filter(x =>

      x.q &&
      x.correct &&
      Array.isArray(x.wrong) &&
      x.wrong.length >= 3

    );

  }


  /* Eski oddiy massiv formati */

  if(Array.isArray(raw)){

    raw.forEach((q,i) => {

      if(Array.isArray(q)){

        pool.push({

          id:
            q.id ||
            ("q" + i),

          q:q[0],

          correct:q[1],

          wrong:[
            q[2],
            q[3],
            q[4]
          ],

          category:
            q.category ||
            "Umumiy"

        });

      }

    });

  }


  return pool.filter(x =>

    x.q &&
    x.correct &&
    Array.isArray(x.wrong) &&
    x.wrong.length >= 3

  );

}


/* =========================
   ARALASHTIRISH
========================= */

function shuffle(arr){

  const a = [...arr];

  for(
    let i = a.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [a[i],a[j]] =
      [a[j],a[i]];

  }

  return a;

}


/* =========================
   MA'LUMOTLAR
========================= */

const defaultState = {

  xp:0,

  games:0,

  correct:0,

  total:0,

  best:0,

  streak:0,

  dailyDate:"",

  dailyDone:false,

  tasks:{},

  achievements:[]

};


let S = loadState();


function loadState(){

  try{

    const x =
      JSON.parse(
        localStorage.getItem(
          "viktorina_state"
        )
      );

    return {
      ...defaultState,
      ...(x || {})
    };

  }catch(e){

    return {
      ...defaultState
    };

  }

}


function saveState(){

  localStorage.setItem(
    "viktorina_state",
    JSON.stringify(S)
  );

}


/* =========================
   O‘YIN HOLATI
========================= */

let G = {

  m:"klassik",

  category:"Barchasi",

  count:10,

  difficulty:"orta",

  questions:[],

  index:0,

  sc:0,

  xp:0,

  correct:0,

  answered:false,

  time:20,

  timer:null,

  quickLeft:60,

  lives:3,

  used5050:false,

  skipped:0,

  streak:0

};


/* =========================
   QIYINLIK
========================= */

const difficultyData = {

  oson:{
    time:30,
    base:10
  },

  orta:{
    time:20,
    base:15
  },

  qiyin:{
    time:15,
    base:20
  },

  judaqiyin:{
    time:10,
    base:30
  }

};


/* =========================
   KATEGORIYALAR
========================= */

function buildCategories(){

  const raw =
    getRawQuestions();

  const grid =
    document.getElementById(
      "categoryGrid"
    );

  if(!grid) return;

  grid.innerHTML = "";

  const names = [
    "Barchasi",
    ...Object.keys(
      raw &&
      typeof raw === "object" &&
      !Array.isArray(raw)
      ? raw
      : {}
    )
  ];


  names.forEach((name,i)=>{

    const b =
      document.createElement(
        "button"
      );

    b.className =
      "cat" +
      (i===0 ? " active" : "");

    b.textContent = name;

    b.onclick = ()=>{

      document
        .querySelectorAll(".cat")
        .forEach(x =>
          x.classList.remove(
            "active"
          )
        );

      b.classList.add("active");

      G.category = name;

    };

    grid.appendChild(b);

  });

}


/* =========================
   REJIM TANLASH
========================= */

function selectMode(mode){

  G.m = mode;

  document
    .querySelectorAll(".mode")
    .forEach(b => {

      b.classList.toggle(
        "active",
        b.dataset.mode === mode
      );

    });


  const settings =
    document.getElementById(
      "settingsCard"
    );

  const category =
    document.getElementById(
      "categoryCard"
    );


  /*
    Tezkor:
    kategoriya va savol soni kerak emas.
  */

  if(mode === "tezkor"){

    settings.style.display =
      "block";

    category.style.display =
      "block";

  }


  /*
    Kunlik:
    faqat bitta savol.
  */

  else if(mode === "kunlik"){

    settings.style.display =
      "none";

    category.style.display =
      "none";

  }


  /*
    Marafon:
    savol soni cheklanmaydi.
  */

  else if(mode === "marafon"){

    settings.style.display =
      "none";

    category.style.display =
      "block";

  }


  else{

    settings.style.display =
      "block";

    category.style.display =
      "block";

  }

}


/* =========================
   O‘YINNI BOSHLASH
========================= */

function startGame(){

  const pool =
    allPool();


  if(!pool.length){

    alert(
      "Savollar topilmadi. questions.js faylini tekshiring."
    );

    return;

  }


  const count =
    Number(
      document.getElementById(
        "countSelect"
      ).value
    );


  const difficulty =
    document.getElementById(
      "difficultySelect"
    ).value;


  let selected = [];


  /* KUNLIK */

  if(G.m === "kunlik"){

    const today =
      new Date()
      .toISOString()
      .slice(0,10);

      Math.floor(
        new Date(today).getTime()

        86400000
      );


    const index =
      dayNumber % pool.length;


    selected = [
      pool[index]
    ];

  }


  /* MARAFON */

  else if(G.m === "marafon"){

    let source =
      pool;


    if(
      G.category &&
      G.category !== "Barchasi"
    ){

      source =
        pool.filter(
          x =>
            x.category ===
            G.category
        );

    }


    selected =
      shuffle(source);

  }


  /* KATEGORIYA */

  else if(
    G.m === "kategoriya"
  ){

    let source =
      pool.filter(
        x =>
          x.category ===
          G.category
      );


    if(!source.length){

      source = pool;

    }


    selected =
      shuffle(source)
      .slice(
        0,
        Math.min(
          count,
          source.length
        )
      );

  }


  /* ARALASH */

  else if(G.m === "aralash"){

    selected =
      shuffle(pool)
      .slice(
        0,
        Math.min(
          count,
          pool.length
        )
      );

  }


  /* 3 JON */

  else if(G.m === "jon"){

    let source =
      pool;


    if(
      G.category &&
      G.category !== "Barchasi"
    ){

      source =
        pool.filter(
          x =>
            x.category ===
            G.category
        );

    }


    selected =
      shuffle(source)
      .slice(
        0,
        Math.min(
          count,
          source.length
        )
      );

  }


  /* KLASSIK VA TEZKOR */

  else{

    let source =
      pool;


    if(
      G.category &&
      G.category !== "Barchasi"
    ){

      source =
        pool.filter(
          x =>
            x.category ===
            G.category
        );

    }


    if(!source.length){

      source = pool;

    }


    selected =
      shuffle(source)
      .slice(
        0,
        Math.min(
          count,
          source.length
        )
      );

  }


  G.count =
    selected.length;


  G.difficulty =
    difficulty;


  G.questions =
    selected;


  G.index = 0;

  G.sc = 0;

  G.xp = 0;

  G.correct = 0;

  G.answered = false;

  G.skipped = 0;

  G.streak = 0;

  G.used5050 = false;

  G.lives =
    G.m === "jon"
    ? 3
    : 999;


  G.quickLeft = 60;


  document.getElementById(

  document.getElementById(

  document.getElementById(
    "game"
  ).style.display = "block";


  showQuestion();

/* =========================
   SAVOLNI KO‘RSATISH
========================= */

function showQuestion(){

  clearInterval(
    G.timer
  );


  if(
    G.index >=
    G.questions.length
  ){

    finishGame();

    return;

  }


  G.answered = false;

  G.used5050 = false;


  const q =
    G.questions[G.index];


  document.getElementById(
    "progressText"
  ).textContent =
    `${G.index + 1} / ${G.questions.length}`;


  document.getElementById(
    "scoreText"
  ).textContent =
    `⭐ ${G.sc}`;


  document.getElementById(
    "categoryLabel"
  ).textContent =
    q.category;


  document.getElementById(
    "questionText"
  ).textContent =
    q.q;


  updateLives();


  const answers =
    shuffle([
      q.correct,
      ...q.wrong
    ]);


  const box =
    document.getElementById(
      "answers"
    );


  box.innerHTML = "";


  answers.forEach(answer => {

    const b =
      document.createElement(
        "button"
      );


    b.className =
      "answer";


    b.textContent =
      answer;


    b.onclick = () =>
      answerQuestion(
        answer,
        b
      );


    box.appendChild(b);

  });


  if(G.m === "tezkor"){

    startQuickTimer();

  }else{

    startNormalTimer();

  }

}


/* =========================
   ODDIY VAQT
========================= */

function startNormalTimer(){

  const d =
    difficultyData[
      G.difficulty
    ] ||
    difficultyData.orta;


  G.time =
    d.time;


  const total =
    d.time;


  updateTimer(
    G.time / total
  );


  G.timer =
    setInterval(()=>{

      G.time -= 0.1;


      updateTimer(
        G.time / total
      );


      if(G.time <= 0){

        clearInterval(
          G.timer
        );


        timeOut();

      }

    },100);

}


/* =========================
   TEZKOR TIMER
========================= */

function startQuickTimer(){

  G.quickLeft =
    G.quickLeft || 60;


  updateTimer(
    G.quickLeft / 60
  );


  G.timer =
    setInterval(()=>{

      G.quickLeft -= 0.1;


      updateTimer(
        G.quickLeft / 60
      );


      if(
        G.quickLeft <= 0
      ){

        clearInterval(
          G.timer
        );


        finishGame();

      }

    },100);

}


/* =========================
   TIMER
========================= */

function updateTimer(percent){

  const bar =
    document.getElementById(
      "timerBar"
    );


  const p =
    Math.max(
      0,
      Math.min(
        1,
        percent
      )
    );


  bar.style.width =
    (p * 100) + "%";

}


/* =========================
   VAQT TUGADI
========================= */

function timeOut(){

  if(G.answered)
    return;


  G.answered = true;

  G.streak = 0;


  document
    .querySelectorAll(".answer")
    .forEach(b =>
      b.classList.add(
        "disabled"
      )
    );


  if(G.m === "jon"){

    G.lives--;

    updateLives();


    if(G.lives <= 0){

      setTimeout(
        finishGame,
        500
      );

      return;

    }

  }


  setTimeout(()=>{

    G.index++;

    showQuestion();

  },500);

}


/* =========================
   JAVOB
========================= */

function answerQuestion(
  answer,
  button
){

  if(G.answered)
    return;


  G.answered = true;


  clearInterval(
    G.timer
  );


  const q =
    G.questions[G.index];


  const correct =
    answer === q.correct;


  document
    .querySelectorAll(".answer")
    .forEach(b =>
      b.classList.add(
        "disabled"
      )
    );


  if(correct){

    button.classList.add(
      "correct"
    );


    G.correct++;

    G.streak++;


    const d =
      difficultyData[
        G.difficulty
      ] ||
      difficultyData.orta;


    const speedBonus =
      Math.max(
        0,
        G.m === "tezkor"
        ? Math.floor(
            G.quickLeft / 10
          )
        : Math.floor(G.time)
      );


    const streakBonus =
      Math.min(
        20,
        Math.max(
          0,
          (G.streak - 1) * 2
        )
      );


    let points =
      d.base +
      speedBonus +
      streakBonus;


    if(G.m === "kunlik"){

      points *= 3;

    }


    points =
      Math.round(
        points
      );


    G.sc +=
      points;


    G.xp +=
      points;


  }else{

    button.classList.add(
      "wrong"
    );


    document
      .querySelectorAll(".answer")
      .forEach(b => {

        if(
          b.textContent ===
          q.correct
        ){

          b.classList.add(
            "correct"
          );

        }

      });


    G.streak = 0;


    if(G.m === "jon"){

      G.lives--;

      updateLives();


      if(G.lives <= 0){

        setTimeout(
          finishGame,
          700
        );

        return;

      }

    }


    if(
      G.m === "marafon"
    ){

      setTimeout(
        finishGame,
        700
      );

      return;

    }

  }


  document.getElementById(
    "scoreText"
  ).textContent =
    `⭐ ${G.sc}`;


  setTimeout(()=>{

    G.index++;

    showQuestion();

  },700);

}


/* =========================
   50/50
========================= */

function use5050(){

  if(G.answered)
    return;


  if(G.used5050)
    return;


  G.used5050 = true;


  const q =
    G.questions[G.index];


  const buttons =
    [
      ...document
        .querySelectorAll(
          ".answer"
        )
    ];


  const wrong =
    buttons.filter(
      b =>
        b.textContent !==
        q.correct
    );


  shuffle(wrong)
    .slice(0,2)
    .forEach(b => {

      b.classList.add(
        "disabled"
      );

      b.style.visibility =
        "hidden";

    });

}


/* =========================
   O‘TKAZISH
========================= */

function skipQuestion(){

  if(G.answered)
    return;


  clearInterval(
    G.timer
  );


  G.answered = true;

  G.skipped++;


  G.streak = 0;


  G.index++;


  showQuestion();

}


/* =========================
   JONLAR
========================= */

function updateLives(){

  const el =
    document.getElementById(
      "lifeText"
    );


  if(G.m !== "jon"){

    el.textContent = "";

    return;

  }


  el.textContent =
    "❤️".repeat(
      Math.max(
        0,
        G.lives
      )
    );

}


/* =========================
   O‘YINNI TUGATISH
========================= */

function finishGame(){

  clearInterval(
    G.timer
  );


  document.getElementById(
    "game"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  S.games++;


  S.correct +=
    G.correct;


  S.total +=
    G.questions.length;


  if(
    G.sc > S.best
  ){

    S.best =
      G.sc;

  }


  const earnedXP =
    Math.max(
      0,
      G.xp +
      Math.round(
        G.sc / 10
      )
    );


  S.xp +=
    earnedXP;


  if(G.m === "kunlik"){

    const today =
      new Date()
      .toISOString()
      .slice(0,10);


    S.dailyDate =
      today;

    S.dailyDone =
      true;

  }


  updateTasks();

  updateAchievements();

  saveState();


  document.getElementById(
    "resultScore"
  ).textContent =
    G.sc + " ball";


  document.getElementById(
    "resultInfo"
  ).innerHTML =

    `To‘g‘ri javoblar: <b>${G.correct}</b><br>` +
    `Javobsiz/o‘tkazilgan: <b>${G.skipped}</b><br>` +
    `Olingan XP: <b>+${earnedXP}</b><br>` +
    `Eng yaxshi natija: <b>${S.best}</b>`;

}
