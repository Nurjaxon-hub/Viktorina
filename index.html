<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viktorina</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="questions.js"></script>

<style>
:root{
  --bg:#080b18;
  --bg2:#10152b;
  --card:#151b35;
  --card2:#1b2342;
  --text:#f8f9ff;
  --muted:#8e98bb;
  --accent:#8b5cf6;
  --accent2:#a78bfa;
  --gold:#fbbf24;
  --green:#22c55e;
  --red:#ef4444;
  --blue:#3b82f6;
  --border:rgba(255,255,255,.07);
}

*{
  box-sizing:border-box;
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 0%,rgba(139,92,246,.22),transparent 32%),
    radial-gradient(circle at 100% 20%,rgba(59,130,246,.12),transparent 28%),
    var(--bg);
  padding:16px 15px 35px;
}

button{
  width:100%;
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  margin:5px 0;
  background:var(--card);
  color:var(--text);
  font-size:15px;
  font-weight:650;
  transition:.15s;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.4;
}

.app{
  max-width:600px;
  margin:auto;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  box-shadow:0 8px 30px rgba(124,58,237,.3);
}

.logo h1{
  font-size:21px;
  font-weight:850;
}

.logo p{
  font-size:12px;
  color:var(--muted);
}

.profile{
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--card);
  border:1px solid var(--border);
  font-size:20px;
}

.hero{
  padding:20px;
  border-radius:24px;
  background:
    linear-gradient(135deg,rgba(139,92,246,.25),rgba(59,130,246,.08)),
    var(--card);
  border:1px solid var(--border);
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  right:-40px;
  top:-40px;
  border-radius:50%;
  background:rgba(167,139,250,.12);
}

.hero-title{
  font-size:26px;
  font-weight:850;
  margin-bottom:5px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:18px;
}

.stat{
  padding:12px 8px;
  text-align:center;
  border-radius:15px;
  background:rgba(0,0,0,.18);
}

.stat b{
  display:block;
  font-size:17px;
}

.stat span{
  color:var(--muted);
  font-size:11px;
}

.level{
  margin-top:15px;
}

.level-line{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
  margin-bottom:6px;
}

.bar{
  height:7px;
  background:#252d4c;
  border-radius:20px;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  border-radius:20px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .4s;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:20px 2px 9px;
}

.section-title h2{
  font-size:16px;
}

.section-title span{
  font-size:11px;
  color:var(--muted);
}

.categories{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:3px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.chip{
  width:auto;
  flex:none;
  padding:9px 14px;
  margin:0;
  border-radius:30px;
  font-size:12px;
}

.chip.active{
  background:var(--accent);
  border-color:var(--accent);
}

.mode-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.mode{
  min-height:120px;
  padding:16px;
  text-align:left;
  border-radius:19px;
  background:var(--card);
  position:relative;
  overflow:hidden;
}

.mode-icon{
  font-size:25px;
  margin-bottom:9px;
}

.mode-title{
  font-size:14px;
  font-weight:800;
}

.mode-info{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.mode.primary{
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  border:0;
}

.bottom-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.small-btn{
  font-size:12px;
  padding:13px 5px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:17px;
  margin:10px 0;
}

.question-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.question-number{
  font-size:13px;
  color:var(--muted);
}

.score{
  font-size:13px;
  font-weight:800;
}

.question{
  font-size:21px;
  line-height:1.35;
  font-weight:800;
  margin:17px 2px;
}

.timer{
  height:7px;
  background:#272e49;
  border-radius:20px;
  overflow:hidden;
  margin:8px 0 18px;
}

.timer i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--green),var(--gold));
  transition:width 1s linear;
}

.answers{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.answer{
  margin:0;
  text-align:left;
  padding:16px;
  min-height:57px;
  background:var(--card);
  border:1px solid var(--border);
}

.answer.correct{
  background:var(--green)!important;
  border-color:var(--green);
}

.answer.wrong{
  background:var(--red)!important;
  border-color:var(--red);
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.tools button{
  margin:0;
  font-size:12px;
}

.result{
  text-align:center;
  padding-top:25px;
}

.result-icon{
  font-size:58px;
  margin-bottom:10px;
}

.result h1{
  font-size:28px;
  margin-bottom:5px;
}

.result-score{
  font-size:42px;
  font-weight:900;
  margin:20px 0;
  background:linear-gradient(90deg,#fbbf24,#f59e0b);
  -webkit-background-clip:text;
  color:transparent;
}

.result-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.result-stat{
  background:var(--card);
  border-radius:16px;
  padding:14px 5px;
}

.result-stat b{
  display:block;
  font-size:19px;
}

.result-stat span{
  color:var(--muted);
  font-size:11px;
}

.back{
  background:transparent;
  border:0;
  text-align:left;
  padding:7px 0;
  margin:0 0 8px;
  width:auto;
}

.rank{
  display:flex;
  align-items:center;
  gap:12px;
}

.rank-num{
  width:30px;
  font-weight:900;
}

.rank-name{
  flex:1;
}

.rank-score{
  font-weight:800;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.diff-info{
  margin-top:10px;
  padding:11px;
  border-radius:14px;
  background:rgba(139,92,246,.10);
  color:var(--muted);
  font-size:11px;
  text-align:center;
}

@media(max-width:380px){
  .mode-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="app" class="app"></div>

<script>

const tg=window.Telegram&&Telegram.WebApp;

try{
  tg.ready();
  tg.expand();
  tg.setHeaderColor("#080b18");
  tg.setBackgroundColor("#080b18");
}catch(e){}

const FEEDBACK_URL="https://t.me/SIZNING_USERNAME";
const FB_PROJECT="";
const FB_KEY="";
const APP_LINK="https://t.me/aqlli_miya_bot/viktorina";

const U=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{
  id:0,
  first_name:"Mehmon"
};

const $=id=>document.getElementById(id);
const app=$("app");

const esc=s=>String(s).replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

const vib=t=>{
  try{
    tg.HapticFeedback.notificationOccurred(t);
  }catch(e){}
};

const shuf=a=>
  a.map(x=>[Math.random(),x])
   .sort((a,b)=>a[0]-b[0])
   .map(x=>x[1]);

let S={
  xp:0,
  best:0,
  medals:[],
  day:"",
  wk:null
};

try{
  Object.assign(
    S,
    JSON.parse(localStorage.getItem("vk")||"{}")
  );
}catch(e){}

const save=()=>{
  try{
    localStorage.setItem("vk",JSON.stringify(S));
  }catch(e){}
};

const lvl=()=>Math.floor(S.xp/100)+1;

const award=n=>{
  if(!S.medals.includes(n)){
    S.medals.push(n);
    save();
  }
};

let cat="Hammasi";
let difficulty="orta";
let questionCount=10;

const DIFFICULTY={
  oson:{
    name:"🟢 Oson",
    time:30,
    base:10,
    mult:1
  },

  orta:{
    name:"🟡 O‘rta",
    time:20,
    base:15,
    mult:1.5
  },

  qiyin:{
    name:"🔴 Qiyin",
    time:15,
    base:20,
    mult:2
  },

  judaqiyin:{
    name:"🔥 Juda qiyin",
    time:10,
    base:30,
    mult:3
  }
};

let G={};

function pool(){

  return Object.entries(Q)
    .filter(([k])=>cat=="Hammasi"||k==cat)
    .flatMap(([k,v])=>v);
}

function home(){

  const cats=[
    "Hammasi",
    ...Object.keys(Q)
  ];

  const progress=S.xp%100;
  const d=DIFFICULTY[difficulty];

  app.innerHTML=`

    <div class="top">

      <div class="logo">

        <div class="logo-icon">
          🧠
        </div>

        <div>
          <h1>Viktorina</h1>
          <p>Aqlingni sinab ko‘r</p>
        </div>

      </div>

      <div class="profile">
        👤
      </div>

    </div>


    <div class="hero">

      <div class="hero-title">
        Salom, ${esc(U.first_name)}! 👋
      </div>

      <div class="muted">
        Bugun nechta savolga javob bera olasan?
      </div>

      <div class="stats">

        <div class="stat">
          <b>⭐ ${S.xp}</b>
          <span>XP</span>
        </div>

        <div class="stat">
          <b>🏆 ${S.best}</b>
          <span>Rekord</span>
        </div>

        <div class="stat">
          <b>🎖 ${S.medals.length}</b>
          <span>Yutuq</span>
        </div>

      </div>

      <div class="level">

        <div class="level-line">
          <span>${lvl()}-daraja</span>
          <span>${progress}/100 XP</span>
        </div>

        <div class="bar">
          <i style="width:${progress}%"></i>
        </div>

      </div>

    </div>


    <div class="section-title">
      <h2>Kategoriya</h2>
      <span>${pool().length} ta savol</span>
    </div>

    <div class="categories">

      ${cats.map(c=>`

        <button
          class="chip ${c==cat?"active":""}"
          onclick="cat='${esc(c)}';home()">

          ${esc(c)}

        </button>

      `).join("")}

    </div>


    <div class="section-title">
      <h2>Qiyinchilik</h2>
    </div>

    <div class="categories">

      <button
        class="chip ${difficulty=="oson"?"active":""}"
        onclick="difficulty='oson';home()">

        🟢 Oson

      </button>

      <button
        class="chip ${difficulty=="orta"?"active":""}"
        onclick="difficulty='orta';home()">

        🟡 O‘rta

      </button>

      <button
        class="chip ${difficulty=="qiyin"?"active":""}"
        onclick="difficulty='qiyin';home()">

        🔴 Qiyin

      </button>

      <button
        class="chip ${difficulty=="judaqiyin"?"active":""}"
        onclick="difficulty='judaqiyin';home()">

        🔥 Juda qiyin

      </button>

    </div>


    <div class="diff-info">

      ${d.name} · ${d.time} soniya ·
      asosiy ${d.base} ball ·
      tez javob uchun qo‘shimcha ball

    </div>


    <div class="section-title">
      <h2>Savollar soni</h2>
    </div>

    <div class="categories">

      <button
        class="chip ${questionCount==10?"active":""}"
        onclick="questionCount=10;home()">

        10 ta

      </button>

      <button
        class="chip ${questionCount==20?"active":""}"
        onclick="questionCount=20;home()">

        20 ta

      </button>

      <button
        class="chip ${questionCount==30?"active":""}"
        onclick="questionCount=30;home()">

        30 ta

      </button>

    </div>


    <div class="section-title">
      <h2>O‘yin rejimi</h2>
    </div>


    <div class="mode-grid">

      <button
        class="mode primary"
        onclick="start('klassik')">

        <div class="mode-icon">
          🎯
        </div>

        <div class="mode-title">
          Klassik
        </div>

        <div class="mode-info">
          ${questionCount} ta savol
        </div>

      </button>


      <button
        class="mode"
        onclick="start('tezkor')">

        <div class="mode-icon">
          ⚡
        </div>

        <div class="mode-title">
          Tezkor
        </div>

        <div class="mode-info">
          60 soniyada maksimal ball
        </div>

      </button>


      <button
        class="mode"
        onclick="start('jon')">

        <div class="mode-icon">
          ❤️
        </div>

        <div class="mode-title">
          3 jon
        </div>

        <div class="mode-info">
          Xato = 1 jon
        </div>

      </button>


      <button
        class="mode"
        onclick="start('kunlik')">

        <div class="mode-icon">
          📅
        </div>

        <div class="mode-title">
          Kunlik
        </div>

        <div class="mode-info">
          ×3 ball
        </div>

      </button>

    </div>


    <div class="bottom-grid">

      <button
        class="small-btn"
        onclick="board()">

        🏆<br>
        Reyting

      </button>


      <button
        class="small-btn"
        onclick="medals()">

        🎖<br>
        Yutuqlar

      </button>


      <button
        class="small-btn"
        onclick="fb()">

        💬<br>
        Taklif

      </button>

    </div>

  `;
}


function fb(){

  try{
    tg.openTelegramLink(FEEDBACK_URL);
  }catch(e){
    open(FEEDBACK_URL);
  }

}


function start(m){

  let p=shuf(pool());

  if(!p.length){
    alert("Savollar topilmadi.");
    return;
  }


  if(m=="kunlik"){

    const d=new Date().toDateString();

    if(S.day==d){

      alert(
        "Bugungi savolga javob berdingiz. Ertaga qaytib keling!"
      );

      return;
    }

    S.day=d;

    save();

    p=[
      shuf(Object.values(Q).flat())[0]
    ];

  }

  else if(m=="klassik"){

    p=p.slice(
      0,
      Math.min(questionCount,p.length)
    );

  }

  else if(m=="jon"){

    p=p.slice(
      0,
      Math.min(questionCount,p.length)
    );

  }

  else{

    p=p.concat(shuf(pool()));

  }


  G={

    m:m,

    p:p,

    i:0,

    sc:0,

    lv:m=="jon"?3:99,

    st:0,

    ok:0,

    h:1,

    s:1,

    lock:0,

    time:DIFFICULTY[difficulty].time,

    maxTime:DIFFICULTY[difficulty].time,

    end:m=="tezkor"
      ?Date.now()+60000
      :0

  };


  ask();

}


function ask(){

  if(
    G.i>=G.p.length||
    G.lv<1||
    (G.end&&Date.now()>=G.end)
  ){

    return fin();

  }


  const q=G.p[G.i];

  const o=shuf(q.slice(1));

  const d=DIFFICULTY[difficulty];


  G.q=q;

  G.o=o;

  G.t=d.time;

  G.maxTime=d.time;

  G.lock=0;


  let info="";


  if(G.m=="tezkor"){

    info=
      `⚡ <span id="g">`+
      `${Math.ceil((G.end-Date.now())/1000)} s`+
      `</span>`;

  }

  else if(G.m=="klassik"){

    info=
      `Savol ${G.i+1}/${G.p.length}`;

  }

  else if(G.m=="jon"){

    info=
      "❤️".repeat(G.lv)+
      ` · ${G.i+1}/${G.p.length}`;

  }

  else{

    info="📅 Kunlik";

  }


  app.innerHTML=`

    <button
      class="back"
      onclick="confirmHome()">

      ← Chiqish

    </button>


    <div class="question-head">

      <div class="question-number">

        ${info}

      </div>


      <div class="score">

        ⭐ ${G.sc}

      </div>

    </div>


    <div class="timer">

      <i
        id="b"
        style="width:100%">

      </i>

    </div>


    <div class="card">

      <div class="muted">

        ${d.name}
        ·
        ${d.time} soniya

      </div>


      <div class="question">

        ${esc(q[0])}

      </div>


      <div class="answers">

        ${o.map((x,k)=>`

          <button
            class="answer"
            id="o${k}"
            onclick="pick(${k})">

            <b>
              ${String.fromCharCode(65+k)}.
            </b>

            ${esc(x)}

          </button>

        `).join("")}

      </div>


      <div class="tools">

        <button
          id="h"
          onclick="half()"
          ${G.h?"":"disabled"}>

          ✂️ 50/50

        </button>


        <button
          id="s"
          onclick="skip()"
          ${G.s?"":"disabled"}>

          ⏭ O‘tkazish

        </button>

      </div>

    </div>

  `;


  clearInterval(G.tm);

  G.tm=setInterval(
    tick,
    1000
  );

}


function tick(){

  G.t--;

  const b=$("b");


  if(b){

    b.style.width=
      Math.max(
        0,
        G.t/G.maxTime*100
      )+"%";

  }


  if(G.end){

    if(Date.now()>=G.end){

      clearInterval(G.tm);

      return fin();

    }


    const g=$("g");


    if(g){

      g.textContent=
        Math.ceil(
          (G.end-Date.now())/1000
        )+" s";

    }

  }


  if(G.t<=0){

    pick(-1);

  }

}


function pick(k){

  if(G.lock)return;


  G.lock=1;

  clearInterval(G.tm);


  const good=
    k>=0 &&
    G.o[k]===G.q[1];


  G.o.forEach((x,j)=>{

    const e=$("o"+j);

    if(!e)return;

    e.disabled=true;


    if(x===G.q[1]){

      e.classList.add(
        "correct"
      );

    }

  });


  if(k>=0&&!good){

    const e=$("o"+k);

    if(e){

      e.classList.add(
        "wrong"
      );

    }

  }


  if(good){

    G.st++;

    G.ok++;


    const d=
      DIFFICULTY[difficulty];


    /*
      Ball tizimi:

      Asosiy ball:
      Oson       = 10
      O‘rta      = 15
      Qiyin      = 20
      Juda qiyin = 30

      Tezlik bonusi:
      qolgan vaqt × 1

      Ketma-ket bonus:
      har bir ketma-ket javob +2,
      maksimum +20
    */


    const base=d.base;

    const speedBonus=
      Math.max(0,G.t);

    const streakBonus=
      Math.min(
        G.st*2,
        20
      );


    let points=
      base+
      speedBonus+
      streakBonus;


    if(G.m=="kunlik"){

      points*=3;

    }


    G.sc+=points;


    vib("success");


    if(G.st==3){

      award(
        "🔥 3 ketma-ket javob"
      );

    }


    if(G.st==5){

      award(
        "🔥 5 ketma-ket javob"
      );

    }


    if(G.st==10){

      award(
        "👑 10 ketma-ket javob"
      );

    }

  }

  else{

    G.st=0;


    if(G.m=="jon"){

      G.lv--;

    }


    vib("error");

  }


  G.i++;


  setTimeout(
    ask,
    850
  );

}


function half(){

  if(!G.h||G.lock)return;


  G.h=0;


  $("h").disabled=true;


  let n=0;


  G.o.forEach((x,j)=>{

    if(
      x!==G.q[1]&&
      n<2
    ){

      n++;


      const e=$("o"+j);


      if(e){

        e.disabled=true;

        e.style.opacity=".2";

      }

    }

  });

}


function skip(){

  if(!G.s||G.lock)return;


  G.s=0;

  clearInterval(G.tm);


  G.i++;


  ask();

}


function confirmHome(){

  if(
    confirm(
      "O‘yindan chiqmoqchimisiz?"
    )
  ){

    clearInterval(G.tm);

    home();

  }

}


function fin(){

  clearInterval(G.tm);


  const xp=
    Math.max(
      5,
      Math.round(G.sc/2)
    );


  const nb=
    G.sc>S.best;


  S.xp+=xp;


  if(nb){

    S.best=G.sc;

  }


  if(
    G.m=="klassik"&&
    G.ok==G.p.length
  ){

    award(
      "💯 Mukammal natija"
    );

  }


  if(G.sc>=250){

    award(
      "🚀 250+ ball"
    );

  }


  if(G.sc>=500){

    award(
      "💎 500+ ball"
    );

  }


  if(G.ok>=10){

    award(
      "🧠 10 ta to‘g‘ri"
    );

  }


  save();

  submit(G.sc);


  app.innerHTML=`

    <div class="result">

      <div class="result-icon">

        ${nb?"🏆":"🎉"}

      </div>


      <h1>

        ${nb
          ?"Yangi rekord!"
          :"O‘yin tugadi!"}

      </h1>


      <p class="muted">

        ${esc(U.first_name)}

      </p>


      <div class="result-score">

        ${G.sc}

      </div>


      <div class="result-stats">

        <div class="result-stat">

          <b>${G.ok}</b>

          <span>
            To‘g‘ri
          </span>

        </div>


        <div class="result-stat">

          <b>
            ${G.p.length-G.ok}
          </b>

          <span>
            Xato
          </span>

        </div>


        <div class="result-stat">

          <b>
            +${xp}
          </b>

          <span>
            XP
          </span>

        </div>

      </div>


      <br>


      <div class="card">

        <div class="level-line">

          <span>
            🏅 ${lvl()}-daraja
          </span>

          <span>
            ${S.xp%100}/100 XP
          </span>

        </div>


        <div class="bar">

          <i
            style="width:${S.xp%100}%">

          </i>

        </div>

      </div>


      <button
        onclick="share()">

        📤 Do‘stlarga ulashish

      </button>


      <button
        onclick="start(G.m)">

        🔁 Qayta o‘ynash

      </button>


      <button
        onclick="home()">

        🏠 Bosh sahifa

      </button>

    </div>

  `;

}


function share(){

  const u=
    "https://t.me/share/url?url="+
    encodeURIComponent(APP_LINK)+
    "&text="+
    encodeURIComponent(
      `Viktorinada ${G.sc} ball to‘pladim! Mendan o‘zib keta olasanmi?`
    );


  try{

    tg.openTelegramLink(u);

  }catch(e){

    open(u);

  }

}


function medals(){

  app.innerHTML=`

    <button
      class="back"
      onclick="home()">

      ← Orqaga

    </button>


    <div class="hero">

      <div class="hero-title">
        🎖 Yutuqlar
      </div>

      <div class="muted">
        O‘yinda erishgan natijalaringiz
      </div>

    </div>


    ${
      S.medals.length
      ?

      S.medals.map(m=>`

        <div class="card">

          ${esc(m)}

        </div>

      `).join("")

      :

      `

        <div class="empty">

          <div style="font-size:45px">
            🏆
          </div>

          <br>

          Hali yutuq yo‘q.

          <br>

          O‘ynang va yutuqlarni
          qo‘lga kiriting!

        </div>

      `
    }

  `;

}


const FS=()=>
  `https://firestore.googleapis.com/v1/projects/${FB_PROJECT}/databases/(default)/documents`;


const wk=()=>{

  const d=new Date();


  return d.getFullYear()+
    "w"+
    Math.ceil(
      (
        d-
        new Date(
          d.getFullYear(),
          0,
          1
        )
      )/864e5+1
    )/7;

};


async function put(col,sc){

  try{

    await fetch(

      `${FS()}/${col}/${U.id}?key=${FB_KEY}`+
      `&updateMask.fieldPaths=name`+
      `&updateMask.fieldPaths=score`,

      {

        method:"PATCH",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          fields:{

            name:{
              stringValue:
                U.first_name
            },

            score:{
              integerValue:
                String(sc)
            }

          }

        })

      }

    );

  }catch(e){}

}


function submit(sc){

  if(
    !FB_PROJECT||
    !U.id
  )return;


  if(
    !S.wk||
    S.wk.k!=wk()
  ){

    S.wk={
      k:wk(),
      b:0
    };

  }


  if(sc>S.wk.b){

    S.wk.b=sc;

    put(
      "w"+wk(),
      sc
    );

  }


  if(sc>=S.best){

    put(
      "all",
      sc
    );

  }


  save();

}


async function board(col){

  col=col||"w"+wk();


  app.innerHTML=`

    <button
      class="back"
      onclick="home()">

      ← Orqaga

    </button>


    <div class="hero">

      <div class="hero-title">
        🏆 Reyting
      </div>

      <div class="muted">
        Eng yuqori natijalar
      </div>

    </div>


    <div class="bottom-grid">

      <button
        class="small-btn"
        onclick="board()">

        📅<br>
        Haftalik

      </button>


      <button
        class="small-btn"
        onclick="board('all')">

        🌎<br>
        Umumiy

      </button>


      <button
        class="small-btn"
        onclick="home()">

        🏠<br>
        Bosh sahifa

      </button>

    </div>


    <div
      id="bd"
      class="empty">

      Yuklanmoqda…

    </div>

  `;


  if(!FB_PROJECT){

    $("bd").innerHTML=`

      <div style="font-size:40px">
        🏆
      </div>

      <br>

      Reyting tizimi
      tez orada ishga tushadi.

    `;

    return;

  }


  try{

    const r=await fetch(

      FS()+":runQuery?key="+FB_KEY,

      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          structuredQuery:{

            from:[
              {
                collectionId:col
              }
            ],

            orderBy:[
              {
                field:{
                  fieldPath:"score"
                },

                direction:
                  "DESCENDING"

              }
            ],

            limit:10

          }

        })

      }

    );


    const L=
      (await r.json())
      .filter(x=>x.document)
      .map(
        x=>x.document.fields
      );


    $("bd").innerHTML=
      L.length

      ?

      L.map((f,i)=>`

        <div class="card rank">

          <div class="rank-num">

            ${
              i==0?"🥇":
              i==1?"🥈":
              i==2?"🥉":
              (i+1)+"."
            }

          </div>


          <div class="rank-name">

            ${esc(
              f.name.stringValue
            )}

          </div>


          <div class="rank-score">

            ${f.score.integerValue}

          </div>

        </div>

      `).join("")

      :

      `

        <div class="empty">

          Hozircha hech kim yo‘q.

        </div>

      `;


  }catch(e){

    $("bd").textContent=
      "Reytingni yuklab bo‘lmadi.";

  }

}


home();

</script>
