/* SAVOLLAR */

function getRawQuestions(){

  try{
    if(typeof questions!=="undefined" && Array.isArray(questions)){
      return questions;
    }
  }catch(e){}

  if(Array.isArray(window.questions)){
    return window.questions;
  }

  if(Array.isArray(window.QUESTIONS)){
    return window.QUESTIONS;
  }

  return [];
}

function allPool(){

  const raw=getRawQuestions();

  return raw.map((q,i)=>{

    if(Array.isArray(q)){

      return {
        id:q.id||("q"+i),
        q:q[0],
        correct:q[1],
        wrong:[q[2],q[3],q[4]],
        category:q.category||"Umumiy"
      };

    }

    return {
      id:q.id||("q"+i),
      q:q.question||q.q||"",
      correct:q.correct||q.answer||"",
      wrong:q.wrong||q.answers||[],
      category:q.category||"Umumiy"
    };

  }).filter(q=>q.q&&q.correct);

}

function shuffle(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;
}


/* SAQLASH */

let S={
  xp:0,
  best:0,
  medals:[],
  day:"",
  wk:null,
  total:0,
  correct:0,
  games:0,
  streak:0,
  maxStreak:0,
  lastLogin:"",
  loginStreak:0,
  dailyBonus:"",
  dailyDone:"",
  tasks:{},
  quickBest:0,
  marathonBest:0
};

try{

  const saved=localStorage.getItem("viktorina_stats");

  if(saved){
    S={...S,...JSON.parse(saved)};
  }

}catch(e){}

function saveStats(){

  try{
    localStorage.setItem(
      "viktorina_stats",

    );
  }catch(e){}

}


/* DARAJA */

const LEVELS=[
  0,100,250,500,900,1400,2000,2800,3800,5000,
  6500,8200,10000,12000,14500,17500,21000,25000,30000,36000
];

function getLevel(){

  let level=1;

  for(let i=0;i<LEVELS.length;i++){

    if(S.xp>=LEVELS[i]){
      level=i+1;
    }

  }

  return level;
}

function getCurrentLevelXP(){
  return LEVELS[getLevel()-1]||0;
}

function getNextLevelXP(){

  const level=getLevel();

  if(level<LEVELS.length){
    return LEVELS[level];
  }

  return LEVELS[LEVELS.length-1]+5000;
}

function getLevelProgress(){

  const current=getCurrentLevelXP();
  const next=getNextLevelXP();

  if(next<=current)return 100;

  return Math.min(
    100,
    Math.max(
      0,
      Math.round(
        ((S.xp-current)/(next-current))*100
      )
    )
  );
}

/* SANA */

function todayKey(){

  const d=new Date();

  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");

}

function dailyQuestion(){

  const arr=allPool();

  if(!arr.length)return null;

  const key=todayKey();

  let n=0;

  for(let i=0;i<key.length;i++){
    n+=key.charCodeAt(i)*(i+1);
  }

  return arr[n%arr.length];

}


/* KATEGORIYALAR */

function getCategories(){

  const arr=allPool();
  const cats=[];

  arr.forEach(q=>{

    if(q.category&&!cats.includes(q.category)){
      cats.push(q.category);
    }

  });

  if(!cats.length){

    return [
      "Umumiy",
      "Tarix",
      "Geografiya",
      "O‘zbekiston",
      "Texnologiya",
      "Fan",
      "Sport",
      "San’at va kino",
      "Hayvonot"
    ];

  }

  return cats;

}


/* TOPSHIRIQLAR */

const DAILY_TASKS=[

  {
    id:"answer10",
    icon:"🧠",
    name:"Bilim mashqi",
    text:"10 ta savolga javob ber",
    goal:10,
    reward:50
  },

  {
    id:"correct5",
    icon:"🎯",
    name:"Aniq javob",
    text:"5 ta to‘g‘ri javob ber",
    goal:5,
    reward:75
  },

  {
    id:"game1",
    icon:"🎮",
    name:"Bir o‘yin",
    text:"1 ta o‘yinni tugat",
    goal:1,
    reward:100
  }

];

function prepareDailyTasks(){

  const today=todayKey();

  if(S.day!==today){

    S.day=today;

    S.tasks={
      answer10:0,
      correct5:0,
      game1:0
    };

    saveStats();

  }

}

function addTask(type,value=1){

  prepareDailyTasks();

  const task=DAILY_TASKS.find(
    x=>x.id===type
  );

  if(!task)return;

  if(S.tasks[type]===undefined){
    S.tasks[type]=0;
  }

  const before=S.tasks[type];

  S.tasks[type]=Math.min(
    task.goal,
    S.tasks[type]+value
  );

  if(
    before<task.goal &&
    S.tasks[type]>=task.goal
  ){

    S.xp+=task.reward;

    setTimeout(()=>{
      toast(
        task.icon+
        " Topshiriq bajarildi! +"+
        task.reward+
        " XP"
      );
    },100);

  }

  saveStats();

}


/* BONUS */

function claimDailyBonus(){

  const today=todayKey();

  if(S.dailyBonus===today){

    toast("🎁 Bugungi bonus allaqachon olindi.");

    return;

  const bonus=50+(getLevel()*10);

  S.dailyBonus=today;
  S.xp+=bonus;

  checkAchievements();
  saveStats();

  toast("🎁 Kunlik bonus: +"+bonus+" XP");

}

function checkAchievements(){

          );

/* TOAST */

function toast(text){

  const old=document.querySelector(".toast");

  if(old)old.remove();

  const el=document.createElement("div");

  el.className="toast";
  el.textContent=text;

  document.body.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },2200);

}

/* O‘YINNI BOSHLASH */

function start(m){

  clearTimers();

  G={
    m:m,
    p:[],
    i:0,
    sc:0,
    xp:0,
    correct:0,
    answered:0,
    streak:0,
    maxStreak:0,
    lives:3,
    time:0,
    timer:null,
    quickTimer:null,
    quickLeft:60,
    ended:false,
    half:false,
    skipped:0,
    category:selectedCategory,
    difficulty:selectedDifficulty
  };


  const all=allPool();

  if(!all.length){

    alert(
      "Savollar topilmadi. questions.js faylini tekshiring."
    );

    return;

  }


  if(m==="kunlik"){

    if(S.dailyDone===todayKey()){

      alert(
        "📅 Bugungi savol allaqachon bajarilgan."
      );

      return;

    }

    const q=dailyQuestion();

    if(q){
      G.p=[q];
    }

  }

  else if(m==="marafon"){

    let arr=
      selectedCategory==="all"
      ? all
      : all.filter(
          q=>q.category===selectedCategory
        );

    G.p=shuffle(arr);

  }

  else if(m==="tezkor"){

    G.p=shuffle(all);

  }

  else{

    let arr=
      selectedCategory==="all"
      ? all
      : all.filter(
          q=>q.category===selectedCategory
        );

    G.p=shuffle(arr).slice(
      0,
      Math.min(
        selectedCount,
        arr.length
      )
    );

  }


  if(!G.p.length){

    alert(
      "Bu bo‘limda savollar topilmadi."
    );

    return;

  }


  ask();

}


/* SAVOL */

function ask(){

  clearTimers();

  if(G.ended)return;


  if(G.i>=G.p.length){

    if(
      G.m==="marafon" ||
      G.m==="tezkor"
    ){

      const all=allPool();

      let arr=
        selectedCategory==="all"
        ? all
        : all.filter(
            q=>q.category===selectedCategory
          );

      G.p.push(...shuffle(arr));

    }else{

      fin();
      return;

    }

  }


  const q=G.p[G.i];

  const d=
    DIFFICULTY[G.difficulty]||
    DIFFICULTY.orta;


  const answers=shuffle([
    q.correct,
    ...q.wrong
  ].filter(Boolean));


  G.currentAnswers=answers;


  document.getElementById("app").innerHTML=`

    <div class="header">

      <div class="logo">
        🧠 Viktorina
      </div>

      <div class="xp-mini">
        ⭐ ${G.sc}
      </div>

    </div>


    <div class="card">

      <div class="question-top">

        <div class="badge">

          ${
            G.m==="tezkor"
            ?"⚡ TEZKOR"
            :G.m==="marafon"
            ?"🔥 MARAFON"
            :G.m==="kunlik"
            ?"📅 KUNLIK"
            :"Savol "+(G.i+1)
          }

        </div>


        <div
          id="timer"
          class="timer">

          ${
            G.m==="tezkor"
            ?G.quickLeft
            :d.time
          }

        </div>

      </div>


      <div class="progress">

        <div
          id="progressBar"
          class="progress-bar"
          style="width:${
            G.m==="tezkor"
            ?(G.quickLeft/60*100)
            :(G.i/G.p.length*100)
          }%">
        </div>

      </div>


      <div class="question">
        ${q.q}
      </div>


      <div
        id="answers"
        class="answers">

        ${answers.map((a,i)=>`

          <button
            class="answer"
            id="ans${i}"
            onclick="pick(${i})">

            ${a}

          </button>

        `).join("")}

      </div>


      <div class="tools">

        <button
          class="tool"
          onclick="half()">

          ✂️ 50/50

        </button>

        <button
          class="tool"
          onclick="skip()">

          ⏭ O‘tkazish

        </button>

      </div>


      ${
        G.m==="jon"
        ?`

        <div class="score-line">

          <span>
            ❤️ Jonlar
          </span>

          <span>
            ${"❤️".repeat(G.lives)}
          </span>

        </div>

        `
        :""
      }


      <div class="score-line">

        <span>
          🔥 Seriya: ${G.streak}
        </span>

        <span>
          🏆 ${G.sc}
        </span>

      </div>

    </div>

  `;


  if(G.m==="tezkor"){

    startQuickTimer();

  }else{

    startQuestionTimer(d.time);

  }

}


/* TIMER */

function clearTimers(){

  if(G.timer){
    clearInterval(G.timer);
    G.timer=null;
  }

  if(G.quickTimer){
    clearInterval(G.quickTimer);
    G.quickTimer=null;
  }

}

function startQuestionTimer(seconds){

  G.time=seconds;

  const el=document.getElementById("timer");

  G.timer=setInterval(()=>{

    G.time--;

    if(el){

      el.textContent=G.time;

      if(G.time<=5){
        el.classList.add("danger");
      }

    }

    if(G.time<=0){

      clearInterval(G.timer);

      timeoutAnswer();

    }

  },1000);

}

function startQuickTimer(){

  const el=document.getElementById("timer");

  G.quickTimer=setInterval(()=>{

    G.quickLeft--;

    if(el){

      el.textContent=G.quickLeft;

      if(G.quickLeft<=10){
        el.classList.add("danger");
      }

    }

    const bar=document.getElementById(
      "progressBar"
    );

    if(bar){

      bar.style.width=
        Math.max(
          0,
          G.quickLeft/60*100
        )+"%";

    }

    if(G.quickLeft<=0){

      clearInterval(G.quickTimer);

      fin();

    }

  },1000);

}


/* JAVOB */

function pick(k){

  if(G.ended)return;

  clearTimers();

  const buttons=
    document.querySelectorAll(".answer");

  buttons.forEach(b=>{
    b.disabled=true;
  });


  const q=G.p[G.i];

  const chosen=
    G.currentAnswers[k];

  const correct=
    chosen===q.correct;


  G.answered++;


  buttons.forEach((b,index)=>{

    if(
      G.currentAnswers[index]===q.correct
    ){

      b.classList.add("correct");

    }

  });


  if(correct){

    buttons[k].classList.add("correct");

    G.correct++;

    G.streak++;

    if(G.streak>G.maxStreak){
      G.maxStreak=G.streak;
    }


    const d=
      DIFFICULTY[G.difficulty]||
      DIFFICULTY.orta;


    const speedBonus=
      Math.max(
        0,
        G.m==="tezkor"
        ?Math.floor(G.quickLeft/10)
        :G.time
      );


    const streakBonus=
      Math.min(
        20,
        Math.max(
          0,
          (G.streak-1)*2
        )
      );


    let points=
      d.base+
      speedBonus+
      streakBonus;


    if(G.m==="kunlik"){
      points*=3;
    }


    points=Math.round(points);

    G.sc+=points;
    G.xp+=points;


    toast(
      "✅ To‘g‘ri! +"+
      points+
      " ochko"
    );


    setTimeout(()=>{

      G.i++;
      G.half=false;

      ask();

    },500);

  }

  else{

    buttons[k].classList.add("wrong");

    G.streak=0;


    if(G.m==="marafon"){

      toast(
        "❌ Xato! Marafon tugadi."
      );

      setTimeout(fin,600);

      return;

    }


    if(G.m==="jon"){

      G.lives--;

      if(G.lives<=0){

        setTimeout(fin,600);

        return;

      }

    }


    toast("❌ Xato!");


    setTimeout(()=>{

      G.i++;
      G.half=false;

      ask();

    },600);

  }

}


/* VAQT TUGASHI */

function timeoutAnswer(){

  if(G.ended)return;

  G.answered++;
  G.streak=0;


  const q=G.p[G.i];

  const buttons=
    document.querySelectorAll(".answer");


  buttons.forEach(b=>{
    b.disabled=true;
  });


  buttons.forEach((b,index)=>{

    if(
      G.currentAnswers[index]===q.correct
    ){

      b.classList.add("correct");

    }

  });


  if(G.m==="marafon"){

    toast(
      "⏰ Vaqt tugadi! Marafon tugadi."
    );

    setTimeout(fin,600);

    return;

  }


  if(G.m==="jon"){

    G.lives--;

    if(G.lives<=0){

      setTimeout(fin,600);

      return;

    }

  }


  toast("⏰ Vaqt tugadi!");


  setTimeout(()=>{

    G.i++;
    G.half=false;

    ask();

  },600);

}


/* 50/50 */

function half(){

  if(G.half){

    toast(
      "✂️ Bu savolda 50/50 ishlatildi."
    );

    return;

  }

  G.half=true;


  const q=G.p[G.i];

  const buttons=
    document.querySelectorAll(".answer");


  let wrong=[];


  G.currentAnswers.forEach(
    (a,index)=>{

      if(a!==q.correct){
        wrong.push(index);
      }

    }
  );


  wrong=shuffle(wrong).slice(0,2);


  wrong.forEach(index=>{

    buttons[index].classList.add(
      "disabled"
    );

    buttons[index].disabled=true;

  });


  toast(
    "✂️ 2 ta noto‘g‘ri javob olib tashlandi."
  );

}


/* O‘TKAZISH */

function skip(){

  if(G.ended)return;

  clearTimers();

  G.skipped++;

  G.i++;

  G.half=false;

  toast("⏭ Savol o‘tkazildi.");

  setTimeout(ask,250);

}


/* YAKUN */

function fin(){

  if(G.ended)return;

  G.ended=true;

  clearTimers();


  S.games++;
  S.total+=G.answered;
  S.correct+=G.correct;


  if(G.sc>S.best){
    S.best=G.sc;
  }


  if(G.m==="tezkor"&&G.correct>S.quickBest){
    S.quickBest=G.correct;
  }


  if(G.m==="marafon"&&G.correct>S.marathonBest){
    S.marathonBest=G.correct;
  }


  if(G.maxStreak>S.maxStreak){
    S.maxStreak=G.maxStreak;
  }


  if(G.m==="kunlik"){
    S.dailyDone=todayKey();
  }


  addTask("answer10",G.answered);
  addTask("correct5",G.correct);
  addTask("game1",1);


  const earnedXP=
    Math.max(
      0,
      G.xp+Math.round(G.sc/10)
    );


  S.xp+=earnedXP;


  checkAchievements();
  saveStats();


  const accuracy=
    G.answered
    ?Math.round(
      G.correct/G.answered*100
    )
    :0;


  document.getElementById("app").innerHTML=`

    <div class="header">

      <div class="logo">
        🧠 Viktorina
      </div>

    </div>


    <div class="card result">

      <div style="font-size:50px">
        ${G.correct===G.answered&&G.answered>0?"🏆":"🎉"}
      </div>

      <h2>
        O‘yin tugadi!
      </h2>

      <div class="result-score">
        ${G.sc}
      </div>

      <div class="muted">
        ochko
      </div>


      <div class="result-stat">
        <span>🎯 To‘g‘ri</span>
        <b>${G.correct}/${G.answered}</b>
      </div>


      <div class="result-stat">
        <span>📊 Aniqlik</span>
        <b>${accuracy}%</b>
      </div>


      <div class="result-stat">
        <span>🔥 Eng uzun seriya</span>
        <b>${G.maxStreak}</b>
      </div>


      <div class="result-stat">
        <span>⭐ XP</span>
        <b>+${earnedXP}</b>
      </div>


      <button
        class="primary"
        onclick="start('${G.m}')">

        🔄 Yana o‘ynash

      </button>


      <div style="height:9px"></div>


      <button
        class="secondary"
        onclick="profile()">

        👤 Profil

      </button>


      <div style="height:9px"></div>


      <button
        class="secondary"
        onclick="shareResult()">

        📤 Natijani ulashish

      </button>


      <div style="height:9px"></div>


      <button
        class="secondary"
        onclick="home()">

        🏠 Bosh sahifa

      </button>

    </div>

  `;

}

function shareResult(){

`🧠 Viktorina

🏆 ${S.best} ochko

🔥 ${S.maxStreak} ketma-ket to‘g‘ri

Men Viktorina’da bilimimni sinayapman!`;

    tg&&

  ){

      "https://t.me/share/url?url="+
      encodeURIComponent(APP_LINK)+
      "&text="+

  }

  }

}
