const LEVELS=[
  0,
  100,
  250,
  500,
  900,
  1400,
  2000,
  2800,
  3800,
  5000,
  6500,
  8200,
  10000,
  12000,
  14500,
  17500,
  21000,
  25000,
  30000,
  36000
];

function getLevel(){

  let level=1;

  for(let i=0;i<LEVELS.length;i++){

    if(S.xp>=LEVELS[i]){
      level=i+1;
    }

  }

  return level;
}

function getCurrentLevelXP(){

  const level=getLevel();

  return LEVELS[level-1]||0;
}

function getNextLevelXP(){

  const level=getLevel();

  if(level<LEVELS.length){
    return LEVELS[level];
  }

  return LEVELS[LEVELS.length-1]+5000;
}

function getLevelProgress(){

  const current=getCurrentLevelXP();
  const next=getNextLevelXP();

  if(next<=current) return 100;

  return Math.min(
    100,
    Math.max(
      0,
      Math.round(
        ((S.xp-current)/(next-current))*100
      )
    )
  );
}

/* =========================

function allPool(){

  let source=[];

  try{
    if(typeof Q!=="undefined" && Q){
      source=Q;
    }
  }catch(e){
    source=[];
  }

  const result=[];

  if(Array.isArray(source)){

    source.forEach((q,index)=>{

      if(Array.isArray(q) && q.length>=5){

        result.push({
          id:index,
          q:q[0],
          correct:q[1],
          wrong:[
            q[2],
            q[3],
            q[4]
          ]
        });

      }

    });

    return result;
  }

  if(source && typeof source==="object"){

    Object.keys(source).forEach(category=>{

      const arr=source[category];

      if(!Array.isArray(arr)) return;

      arr.forEach((q,index)=>{

        if(Array.isArray(q) && q.length>=5){

          result.push({
            id:category+"_"+index,
            q:q[0],
            correct:q[1],
            wrong:[
              q[2],
              q[3],
              q[4]
            ],
            category:category
          });

        }

      });

    });

  }

  return result;

}

function getCategories(){

  const arr=allPool();

  const set=[];

  arr.forEach(q=>{

    if(q.category&&!set.includes(q.category)){
      set.push(q.category);
    }

  });

  if(!set.length){

    return [
      "Umumiy",
      "Tarix",
      "Geografiya",
      "O‘zbekiston",
      "Texnologiya",
      "Fan",
      "Sport",
      "San’at va kino",
      "Hayvonot"
    ];

  }

  return set;

}

function shuffle(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}

function pool(){

  const all=allPool();

  if(!G.category||G.category==="all"){
    return all;
  }

  return all.filter(
    q=>q.category===G.category
  );

}


/* =========================
   SANA
========================= */

function todayKey(){

  const d=new Date();

  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");

}

function dailyQuestion(){

  const arr=allPool();

  if(!arr.length) return null;

  const key=todayKey();

  let n=0;

  for(let i=0;i<key.length;i++){
    n+=key.charCodeAt(i)*(i+1);
  }

  return arr[n%arr.length];

}


/* =========================
   HAFTALIK KALIT
========================= */

function wk(){

  const d=new Date();

  const start=new Date(
    d.getFullYear(),
    0,
    1
  );

  const day=
    Math.floor((d-start)/864e5)+1;

  const week=Math.ceil(day/7);

  return d.getFullYear()+"w"+week;

}

function prepareDailyTasks(){

  const today=todayKey();

  if(S.day!==today){

    S.day=today;

    S.tasks={
      answer10:0,
      correct5:0,
      game1:0
    };

    saveStats();

  }

}

function addTask(type,value=1){

  prepareDailyTasks();

  const task=DAILY_TASKS.find(
    x=>x.id===type
  );

  if(!task) return;

  if(S.tasks[type]===undefined){
    S.tasks[type]=0;
  }

  const before=S.tasks[type];

  S.tasks[type]=Math.min(
    task.goal,
    S.tasks[type]+value
  );

  if(
    before<task.goal &&
    S.tasks[type]>=task.goal
  ){

    S.xp+=task.reward;

    toast(
      task.icon+" Topshiriq bajarildi! +"+
      task.reward+" XP"
    );

  }

  saveStats();

}

  ACHIEVEMENTS.forEach(a=>{

        S.medals.push(a.id);

        changed=true;

        setTimeout(()=>{

            a.name
          );
        },100);

    }catch(e){}

  });

    saveStats();
  }

}


/* =========================

========================= */

function toast(text){

  const old=document.querySelector(".toast");

  if(old) old.remove();

  const el=document.createElement("div");

  el.className="toast";

  el.textContent=text;

  document.body.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },2200);

}

/* =========================
   O‘YINNI BOSHLASH
========================= */

function start(m){

  clearTimers();

  G={
    m:m,
    p:[],
    i:0,
    sc:0,
    xp:0,
    correct:0,
    answered:0,
    streak:0,
    maxStreak:0,
    lives:3,
    time:0,
    timer:null,
    quickTimer:null,
    quickLeft:60,
    ended:false,
    half:false,
    skipped:0,
    category:selectedCategory,
    difficulty:selectedDifficulty
  };


  const all=allPool();

  if(!all.length){

    alert(
      "Savollar bazasi topilmadi."
    );

    return;

  }


  if(m==="kunlik"){

    const today=todayKey();

    if(S.dailyDone===today){

      alert(
        "📅 Bugungi savol allaqachon bajarilgan."
      );

      return;

    }

    const q=dailyQuestion();

    if(q){
      G.p=[q];
    }

  }


  else if(m==="marafon"){

    G.p=shuffle(
      selectedCategory==="all"
      ? all
      : all.filter(
          q=>q.category===selectedCategory
        )
    );

  }


  else if(m==="tezkor"){

    G.p=shuffle(all);

  }


  else{

    let arr;

    if(
      m==="aralash" ||
      selectedCategory==="all"
    ){

      arr=all;

    }else{

      arr=all.filter(
        q=>q.category===selectedCategory
      );

    }

    G.p=shuffle(arr).slice(
      0,
      Math.min(
        selectedCount,
        arr.length
      )
    );

  }


  if(!G.p.length){

    alert("Bu bo‘limda savollar topilmadi.");

    return;

  }


  if(m==="tezkor"){

    G.quickLeft=60;

  }


  ask();

}


/* =========================
   SAVOLNI KO‘RSATISH
========================= */

function ask(){

  clearTimers();

  if(G.ended) return;


  if(G.i>=G.p.length){

    if(
      G.m==="marafon" ||
      G.m==="tezkor"
    ){

      const extra=shuffle(
        selectedCategory==="all"
        ? allPool()
        : allPool().filter(
            q=>q.category===selectedCategory
          )
      );

      if(extra.length){

        G.p.push(...extra);

      }else{

        fin();

        return;

      }

    }else{

      fin();

      return;

    }

  }


  const q=G.p[G.i];

  const d=DIFFICULTY[
    G.difficulty
  ]||DIFFICULTY.orta;


  let answers=shuffle([
    q.correct,
    ...q.wrong
  ]);


  G.currentAnswers=answers;


  const app=document.getElementById("app");


  app.innerHTML=`

    <div class="header">

      <div class="logo">
        🧠 Viktorina
      </div>

      <div class="xp-mini">
        ⭐ ${G.sc}
      </div>

    </div>


    <div class="card">

      <div class="question-top">

        <div class="badge">
          ${
            G.m==="tezkor"
            ? "⚡ TEZKOR"
            : G.m==="marafon"
            ? "🔥 MARAFON"
            : G.m==="kunlik"
            ? "📅 KUNLIK"
            : "Savol "+(G.i+1)
          }
        </div>

        <div
          id="timer"
          class="timer">

          ${
            G.m==="tezkor"
            ? G.quickLeft
            : d.time
          }

        </div>

      </div>


      ${
        G.m==="tezkor"
        ?`

        <div class="progress">
          <div
            id="progressBar"
            class="progress-bar"
            style="width:${Math.max(
              0,
              G.quickLeft/60*100
            )}%">
          </div>
        </div>

        `
        :`

        <div class="progress">

          <div
            class="progress-bar"
            style="width:${
              G.p.length
              ? (G.i/G.p.length)*100
              : 0
            }%">

          </div>

        </div>

        `
      }


      <div class="question">
        ${q.q}
      </div>


      <div
        id="answers"
        class="answers">

        ${answers.map((a,index)=>`

          <button
            class="answer"
            id="ans${index}"
            onclick="pick(${index})">

            ${a}

          </button>

        `).join("")}

      </div>


      <div class="tools">

        <button
          class="tool"
          onclick="half()">

          ✂️ 50/50

        </button>

        ${
          G.m!=="kunlik"
          ?`

          <button
            class="tool"
            onclick="skip()">

            ⏭ O‘tkazish

          </button>

          `
          :`
          <button
            class="tool"
            onclick="skip()">

            ⏭ O‘tkazish

          </button>
          `
        }

      </div>


      ${
        G.m==="jon"
        ?`

        <div class="score-line">

          <span>
            ❤️ Jonlar
          </span>

          <span>
            ${"❤️".repeat(G.lives)}
          </span>

        </div>

        `
        :""
      }


      <div class="score-line">

        <span>
          🔥 Seriya: ${G.streak}
        </span>

        <span>
          🏆 ${G.sc}
        </span>

      </div>

    </div>

  `;


  if(G.m==="tezkor"){

    startQuickTimer();

  }else{

    startQuestionTimer(d.time);

  }

}


/* =========================
   VAQT
========================= */

function clearTimers(){

  if(G.timer){
    clearInterval(G.timer);
    G.timer=null;
  }

  if(G.quickTimer){
    clearInterval(G.quickTimer);
    G.quickTimer=null;
  }

}

function startQuestionTimer(seconds){

  G.time=seconds;

  const el=document.getElementById("timer");

  G.timer=setInterval(()=>{

    G.time--;

    if(el){

      el.textContent=G.time;

      if(G.time<=5){
        el.classList.add("danger");
      }

    }

    if(G.time<=0){

      clearInterval(G.timer);

      timeoutAnswer();

    }

  },1000);

}

function startQuickTimer(){

  const el=document.getElementById("timer");

  G.quickTimer=setInterval(()=>{

    G.quickLeft--;

    if(el){

      el.textContent=G.quickLeft;

      if(G.quickLeft<=10){
        el.classList.add("danger");
      }

    }

    const bar=
      document.getElementById(
        "progressBar"
      );

    if(bar){

      bar.style.width=
        Math.max(
          0,
          G.quickLeft/60*100
        )+"%";

    }

    if(G.quickLeft<=0){

      clearInterval(G.quickTimer);

      fin();

    }

  },1000);

}


/* =========================
   JAVOB
========================= */

function pick(k){

  if(G.ended) return;

  const buttons=
    document.querySelectorAll(".answer");

  buttons.forEach(b=>{
    b.disabled=true;
  });

  clearTimers();


  const q=G.p[G.i];

  const chosen=
    G.currentAnswers[k];

  const correct=
    chosen===q.correct;


  G.answered++;


  buttons.forEach((b,index)=>{

    if(
      G.currentAnswers[index]===q.correct
    ){

      b.classList.add("correct");

    }

  });


  if(correct){

    buttons[k].classList.add("correct");

    G.correct++;

    G.streak++;

    if(G.streak>G.maxStreak){
      G.maxStreak=G.streak;
    }


    const d=
      DIFFICULTY[
        G.difficulty
      ]||DIFFICULTY.orta;


    const base=d.base;


    let speedBonus=0;

    if(G.m==="tezkor"){

      speedBonus=
        Math.min(
          10,
          Math.max(
            0,
            Math.floor(G.quickLeft/10)
          )
        );

    }else{

      speedBonus=
        Math.max(
          0,
          G.time
        );

    }


    const streakBonus=
      Math.min(
        20,
        Math.max(
          0,
          (G.streak-1)*2
        )
      );


    let points=
      base+
      speedBonus+
      streakBonus;


    if(G.m==="kunlik"){
      points*=3;
    }


    points=Math.round(points);


    G.sc+=points;

    G.xp+=points;


    toast(
      "✅ To‘g‘ri! +"+
      points+
      " ochko"
    );


    setTimeout(()=>{

      G.i++;

      ask();

    },550);

  }


  else{

    buttons[k].classList.add("wrong");

    G.streak=0;


    if(G.m==="marafon"){

      toast(
        "❌ Xato! Marafon tugadi."
      );

      setTimeout(
        fin,
        650
      );

      return;

    }


    if(G.m==="jon"){

      G.lives--;

      toast(
        "❌ Xato! Qolgan jon: "+
        G.lives
      );


      if(G.lives<=0){

        setTimeout(
          fin,
          650
        );

        return;

      }

    }else{

      toast("❌ Xato!");

    }


    setTimeout(()=>{

      G.i++;

      ask();

    },650);

  }

}


/* =========================
   VAQT TUGASHI
========================= */

function timeoutAnswer(){

  if(G.ended) return;

  G.answered++;

  G.streak=0;


  const q=G.p[G.i];

  const buttons=
    document.querySelectorAll(".answer");


  buttons.forEach(b=>{
    b.disabled=true;
  });


  buttons.forEach((b,index)=>{

    if(
      G.currentAnswers[index]===q.correct
    ){

      b.classList.add("correct");

    }

  });


  if(G.m==="marafon"){

    toast(
      "⏰ Vaqt tugadi! Marafon tugadi."
    );

    setTimeout(
      fin,
      650
    );

    return;

  }


  if(G.m==="jon"){

    G.lives--;

    if(G.lives<=0){

      setTimeout(
        fin,
        650
      );

      return;

    }

  }


  toast("⏰ Vaqt tugadi!");


  setTimeout(()=>{

    G.i++;

    ask();

  },650);

}
